<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>call back</title>
</head>
<body>
    <script>    
        const getUserName = () =>{
            console.log("Nguyen van A");
        }

        //tao 1 ham su dung callback
        const demoCallback = (callback)=>{
           setTimeout(()=>{
               callback()
           },1000)
           console.log("1");
           console.log("2");
           console.log("3");     
        }
        demoCallback(getUserName)
    </script>
</body>
</html>
