<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise race</title>
</head>
<body>
    <script>    
        const promise1 = new Promise((_, reject)=> setTimeout(reject, 3000, "Loi tu Promuse 01"))
        const promise2 = new Promise((resolve)=> setTimeout(resolve, 1000, "thanh cong tu Promise 02"))
        const promise3 = new Promise((resolve)=> setTimeout(resolve, 500, "thanh cong tu Promise 03"))
        
        //.race lay cai nao thuc hien nhanh nhat
        Promise.race([promise1, promise2, promise3])
        .then((result )=>{
            console.log("ket qua dau tien: ", result);
            
        }).catch((error)=>{
            console.log("Loi dau tien: ", error);
            
        })

    </script>
</body>
</html>
