<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise all</title>
</head>
<body>
    <script>    
        const task = (taskName, delay, shoulFail = false)=>{
            return new Promise((resolve, reject)=>{
                setTimeout(()=>{
                    if(shoulFail){
                        reject(`${taskName} that bai`)
                    }else{
                        resolve(`Hoan thanh ${taskName}`)
                    }
                },delay)
            })
        }
        const promise1 = task("tac vu 1", 1000)
        const promise2 = task("tac vu 2", 500, true)
        const promise3 = task("tac vu 3", 3000)

        Promise.all([promise1, promise1, promise3])
        .then((results)=>{
            console.log("Tat ca cac tac vu hoan thanh: ", results);

            
        })
        .catch((error)=>{
            console.log("Error: ", error);
            
        })
    </script>
</body>
</html>
