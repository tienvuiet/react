<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise chain</title>
</head>
<body>
    <script>    
        const delayStep = (stepName, delay)=>{
            return new Promise((resolve)=>{
                setTimeout(()=>{
                    console.log(`${stepName}`);
                    resolve(stepName)
                }, delay)
            })
        }


       delayStep("buoc 1", 1000)
       .then((resul1)=>{
        console.log("Hoan thanh ", resul1);
        return delayStep("buoc 2:", 1000)
       }).then((resul2)=>{
        console.log("Hoan thanh ", resul2);
        return delayStep("buoc 3:", 1000)
       }).then((resul3)=>{
        console.log("Hoan thanh chuoi promise: ", resul3);
        
       })
       .catch((error)=>{
        console.log("Error: ", error);
        
       })
        
    </script>
</body>
</html>
