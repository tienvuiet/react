<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>    
        const getData = ()=>{
            return new Promise((resolve, reject)=>{
                // setTimeout(resolve, 1000,"Lay du lieu thanh cong")
                setTimeout(reject, 1000,"Lay du lieu that bai")
            })
        }
        //tao ra mot ham async
        const fetchData = async ()=>{
           try {
            //chay vao khi promise thanh cong
            const data =  await getData()
           console.log("Data", data);
           } catch (error) {
            //chay vao khi promise that bai
            console.error("Error: ", error)
            
           } finally{
            console.log("Hoan thanh chuong trinh");
            
           }
           
        }
        fetchData()
    </script>
</body>
</html>
